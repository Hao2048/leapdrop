name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build universal app
        run: cargo tauri build --target universal-apple-darwin

      # 关键：tauri 产物没有完整签名，直接分发会被 Gatekeeper 判为「已损坏」且无法放行。
      # 无 Apple Developer 账号时用 ad-hoc 签名；有账号请改用 Developer ID + notarytool 公证。
      - name: Ad-hoc sign and rebuild dmg
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/LeapDrop.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/" && ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname LeapDrop -srcfolder "$STAGE" -ov -format UDZO LeapDrop_universal.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: LeapDrop_universal.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '跃传 LeapDrop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
